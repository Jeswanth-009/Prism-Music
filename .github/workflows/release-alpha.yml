name: Android Alpha Release (Manual / Tag)

# ─────────────────────────────────────────────────────────────────
# This workflow is for MANUAL re-runs or tag-based re-builds only.
# Automatic releases are handled entirely by auto-version.yml.
#
# Triggers:
#   • Push of an "alpha-v*" tag  (e.g. re-tag and push to re-build)
#   • Manual workflow_dispatch
# ─────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "alpha-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Alpha APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ── 2. Java & Flutter setup ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (3.38.4 stable)
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── Quality Gates (M32) ───────────────────────────────────────
      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      # ── 3. Read version from pubspec.yaml ─────────────────────────
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"

          if [[ -z "$BUILD_NAME" ]]; then
            echo "ERROR: Could not parse version from pubspec.yaml"
            exit 1
          fi

          echo "build_name=$BUILD_NAME"     >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $BUILD_NAME+$BUILD_NUMBER"

      # ── 4. Resolve the release tag ────────────────────────────────
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="alpha-v${{ steps.app_version.outputs.build_name }}-build${{ steps.app_version.outputs.build_number }}-run${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG"                            >> "$GITHUB_OUTPUT"
          echo "release_name=Prism Music $TAG"        >> "$GITHUB_OUTPUT"

      # ── 5. Optional release signing ───────────────────────────────
      - name: Configure Android signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS:          ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD:       ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" \
             && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            # app/build.gradle.kts resolves storeFile relative to android/app/,
            # so the keystore lives at android/ and the path needs the ../ prefix.
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=../release-keystore.jks"
            } > android/key.properties
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
            echo "SIGNING_FLAG=" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "SIGNING_FLAG=-PdebugSigning=true" >> "$GITHUB_ENV"
            echo "::warning::No release signing secrets found. Building with debug-signing for CI artifact inspection; public GitHub release publication will be skipped (fail-closed)."
          fi

      # ── 6. Build release APK ──────────────────────────────────────
      # Both --build-name and --build-number are passed so the APK's
      # versionName and versionCode match the release tag exactly.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ steps.app_version.outputs.build_name }}" \
            --build-number "${{ steps.app_version.outputs.build_number }}" \
            ${{ env.SIGNING_FLAG }}
          mkdir -p build/release-apks
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release-apks/app-phone-release.apk

      - name: Build x86_64 emulator APK
        run: |
          flutter build apk --release \
            --target-platform android-x64 \
            --build-name "${{ steps.app_version.outputs.build_name }}" \
            --build-number "${{ steps.app_version.outputs.build_number }}" \
            ${{ env.SIGNING_FLAG }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release-apks/app-emulator-x86_64-release.apk

      # ── 7. Build release App Bundle ───────────────────────────────
      - name: Build release App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.app_version.outputs.build_name }}" \
            --build-number "${{ steps.app_version.outputs.build_number }}" \
            ${{ env.SIGNING_FLAG }}

      # ── 8. Certificate check ──────────────────────────────────────
      - name: Verify signing certificate fingerprint
        if: env.SIGNED_BUILD == 'true'
        shell: bash
        run: |
          echo "Verifying APK signing certificate fingerprint..."
          keytool -printcert -jarfile build/release-apks/app-phone-release.apk

      # ── 9. Generate SBOM ──────────────────────────────────────────
      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: "prism-music-${{ steps.release_tag.outputs.tag }}-sbom.spdx.json"

      # ── 10. Stage assets ──────────────────────────────────────────
      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          APK_SRC="build/release-apks/app-phone-release.apk"
          EMULATOR_APK_SRC="build/release-apks/app-emulator-x86_64-release.apk"
          AAB_SRC="build/app/outputs/bundle/release/app-release.aab"
          SBOM_SRC="prism-music-${TAG}-sbom.spdx.json"

          APK_OUT="prism-music-${TAG}-android.apk"
          EMULATOR_APK_OUT="prism-music-${TAG}-android-emulator-x86_64.apk"
          AAB_OUT="prism-music-${TAG}.aab"
          SBOM_OUT="prism-music-${TAG}-sbom.spdx.json"

          if [[ ! -f "$APK_SRC" ]]; then
            echo "ERROR: Release APK not found at $APK_SRC"; exit 1
          fi
          if [[ ! -f "$EMULATOR_APK_SRC" ]]; then
            echo "ERROR: Emulator APK not found at $EMULATOR_APK_SRC"; exit 1
          fi
          if [[ ! -f "$AAB_SRC" ]]; then
            echo "ERROR: Release AAB not found at $AAB_SRC"; exit 1
          fi

          cp "$APK_SRC" "$APK_OUT"
          cp "$EMULATOR_APK_SRC" "$EMULATOR_APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"
          sha256sum "$APK_OUT" > "${APK_OUT}.sha256"
          sha256sum "$EMULATOR_APK_OUT" > "${EMULATOR_APK_OUT}.sha256"
          sha256sum "$AAB_OUT" > "${AAB_OUT}.sha256"

          if [[ -f "$SBOM_SRC" ]]; then
            sha256sum "$SBOM_OUT" > "${SBOM_OUT}.sha256"
            echo "sbom=$SBOM_OUT"                   >> "$GITHUB_OUTPUT"
            echo "sbom_sha=${SBOM_OUT}.sha256"       >> "$GITHUB_OUTPUT"
          fi

          echo "apk=$APK_OUT"                     >> "$GITHUB_OUTPUT"
          echo "emulator_apk=$EMULATOR_APK_OUT"   >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_OUT"                     >> "$GITHUB_OUTPUT"
          echo "apk_sha=${APK_OUT}.sha256"         >> "$GITHUB_OUTPUT"
          echo "emulator_apk_sha=${EMULATOR_APK_OUT}.sha256" >> "$GITHUB_OUTPUT"
          echo "aab_sha=${AAB_OUT}.sha256"         >> "$GITHUB_OUTPUT"

      # ── 11. Attest Build Provenance ───────────────────────────────
      - name: Attest Build Provenance
        if: env.SIGNED_BUILD == 'true'
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.emulator_apk }}
            ${{ steps.assets.outputs.aab }}

      # ── 12. Upload artifacts ──────────────────────────────────────
      - name: Upload release artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: prism-music-${{ steps.release_tag.outputs.tag }}
          path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.emulator_apk }}
            ${{ steps.assets.outputs.aab }}
            ${{ steps.assets.outputs.apk_sha }}
            ${{ steps.assets.outputs.emulator_apk_sha }}
            ${{ steps.assets.outputs.aab_sha }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha }}
          if-no-files-found: error

      # ── 13. Publish / update GitHub Release ───────────────────────
      - name: Publish GitHub Release
        if: env.SIGNED_BUILD == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name:    ${{ steps.release_tag.outputs.tag }}
          name:        ${{ steps.release_tag.outputs.release_name }}
          prerelease:  true
          generate_release_notes: true
          body: |
            ## Prism Music — Manual / Tag Re-Build

            | Field | Value |
            |-------|-------|
            | **Version** | `${{ steps.app_version.outputs.build_name }}+${{ steps.app_version.outputs.build_number }}` |
            | **versionCode** | `${{ steps.app_version.outputs.build_number }}` |
            | **Signed APK** | `${{ env.SIGNED_BUILD }}` |
            | **Source ref** | `${{ github.ref_name }}` |

            > ⚠️ This is a pre-release build.

            ### Install
            Download the single `android.apk` file and tap it to install. It supports
            both modern 64-bit and older 32-bit ARM phones. The separately labelled
            `android-emulator-x86_64.apk` is only for PC Android emulators.
          files: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.emulator_apk }}
            ${{ steps.assets.outputs.aab }}
            ${{ steps.assets.outputs.apk_sha }}
            ${{ steps.assets.outputs.emulator_apk_sha }}
            ${{ steps.assets.outputs.aab_sha }}
            ${{ steps.assets.outputs.sbom }}
            ${{ steps.assets.outputs.sbom_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip publishing unsigned release
        if: env.SIGNED_BUILD != 'true'
        run: |
          echo "::warning::Release artifacts were built with debug signing and uploaded as workflow artifacts, but will NOT be published as a GitHub release because production signing keys are missing."
