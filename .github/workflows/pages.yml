name: Deploy Website

# Publishes the marketing site (website/) to GitHub Pages.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed so configure-pages can enable Pages itself (enablement: true)
  # when the repo has never had Pages configured — no manual setup needed.
  administration: write

# Allow only one concurrent deploy; never cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages automatically on first deploy if not configured yet.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
