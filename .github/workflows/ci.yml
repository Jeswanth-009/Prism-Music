name: Flutter CI

# ─────────────────────────────────────────────────────────────────
# Runs on:
#   • Every pull request (all branches)
#   • Pushes to main / develop — but NOT bot version-bump commits
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, Test, Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── Clean Bot Filter ──────────────────────────────────────────
    # Simply ignore any actions triggered directly by the automated bot
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@8df10395026301dbd96443422813ec3be5143789 # v4.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (3.38.4 stable)
        uses: subosito/flutter-action@f2c4f66bb077b9660233633630d71a1727725920 # v2.18.0
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a12fe429233114 # v4.4.3
        with:
          name: prism-music-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  security-scan:
    name: Dependency Vulnerability Scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan dependencies with OSV-Scanner
        uses: google/osv-scanner-action@555fe237000c01282ec6179e8e040775d790d796 # v1.9.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
