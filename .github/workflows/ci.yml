name: Flutter CI

# ─────────────────────────────────────────────────────────────────
# Runs on:
#   • Every pull request (all branches)
#   • Pushes to main / develop — but NOT bot version-bump commits
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, Test, Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dsun.net.client.defaultConnectTimeout=180000 -Dsun.net.client.defaultReadTimeout=180000"

    # ── Clean Bot Filter ──────────────────────────────────────────
    # Simply ignore any actions triggered directly by the automated bot
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify keystore integrity
        run: |
          if [ -f "android/key.properties" ]; then
            echo "ERROR: android/key.properties must not be committed to git." >&2
            exit 1
          fi
          if [ -f "android/app/debug.keystore" ]; then
            KEYSTORE_INFO=$(keytool -list -v -keystore android/app/debug.keystore -storepass android)
            if ! echo "$KEYSTORE_INFO" | grep -q "androiddebugkey"; then
              echo "ERROR: debug.keystore does not contain androiddebugkey alias." >&2
              exit 1
            fi
            if ! echo "$KEYSTORE_INFO" | grep -q "CN=Android Debug"; then
              echo "ERROR: debug.keystore is not an Android debug certificate." >&2
              exit 1
            fi
            echo "Keystore integrity verified: debug-only certificate."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Set up Flutter (3.38.4 stable)
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Run playback latency benchmark & regressions
        run: |
          flutter test test/benchmark/playback_benchmark_matrix_test.dart
          flutter test test/regressions/audio_playback_regression_test.dart

      - name: Pre-fetch Gradle wrapper
        run: |
          for i in 1 2 3 4 5; do
            (cd android && ./gradlew --version) && break || {
              echo "Gradle wrapper init attempt $i failed, retrying in 5s..."
              sleep 5
            }
          done

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: prism-music-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  security-scan:
    name: Dependency Vulnerability Scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and run OSV-Scanner
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --lockfile=pubspec.lock

  desktop-linux:
    name: Build Linux Desktop (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter (3.38.4 stable)
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux desktop release
        run: flutter build linux --release

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: prism-music-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  emulator-smoke-test:
    name: Background Playback Smoke Test (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (3.38.4 stable)
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Background Playback Smoke Test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/app_flow_test.dart
