name: Flutter CI

# ─────────────────────────────────────────────────────────────────
# Runs on:
#   • Every pull request (all branches)
#   • Pushes to main / develop — but NOT bot version-bump commits
# ─────────────────────────────────────────────────────────────────
on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, Test, Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── Loop guard ────────────────────────────────────────────────
    # Skip jobs triggered by the auto-version bot commit so CI time
    # is not wasted on a pure version-bump with no code changes.
    if: >
      github.event_name != 'push' ||
      (
        github.actor != 'github-actions[bot]' &&
        !startsWith(github.event.head_commit.message, 'chore: bump version')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use stable channel without a pinned version so the workflow
      # works regardless of which Flutter version is currently latest.
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-music-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
