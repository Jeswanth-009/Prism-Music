name: Auto Version + Release

# ─────────────────────────────────────────────────────────────────
# Trigger: every push to main EXCEPT
#   • pushes made by the GitHub Actions bot itself (loop guard)
#   • pure-documentation changes (.md / docs/**)
# Manual dispatch lets you choose the bump type.
# ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      # Marketing-site changes don't affect the app; don't burn an APK build.
      - "website/**"
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type (patch / minor / major)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# ─────────────────────────────────────────────────────────────────
# Permissions needed to push commits/tags and create releases
# ─────────────────────────────────────────────────────────────────
permissions:
  contents: write

# Only one release at a time; never cancel an in-flight release.
concurrency:
  group: auto-version-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump Version → Build APK → Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # ── Loop guard ───────────────────────────────────────────────
    # Skip if the commit that triggered this run was already made by
    # the bot (i.e. the version-bump commit from a previous run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !startsWith(github.event.head_commit.message, 'chore: bump version')
      )

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT or the built-in token; the bot token cannot
          # trigger other workflows but that is fine here.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Git identity ──────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── 3. Read current version ──────────────────────────────────
      - name: Read current version from pubspec.yaml
        id: current_version
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ -z "$VERSION_LINE" ]]; then
            echo "ERROR: Could not parse version from pubspec.yaml"
            exit 1
          fi
          VERSION_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          echo "version_line=$VERSION_LINE"   >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME"   >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER"   >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION_LINE (name=$VERSION_NAME, build=$BUILD_NUMBER)"

      # ── 4. Calculate next version ─────────────────────────────────
      # The commit message and dispatch input are passed via `env` on
      # purpose: `${{ }}` interpolation pastes the raw value into the
      # shell script, so a multi-line commit message containing quotes
      # breaks the script's quoting (a bare `+` token even ends up
      # executed as a command — "line 44: +: command not found").
      # Env vars reach bash verbatim and are always safe to quote.
      - name: Calculate next version
        id: next_version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_BUMP_TYPE: ${{ github.event.inputs.version_type }}
          CURRENT_VERSION_LINE: ${{ steps.current_version.outputs.version_line }}
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version_name }}"
          CURRENT_BUILD="${{ steps.current_version.outputs.build_number }}"

          # A version whose tag already exists has already been released;
          # it must never be re-tagged. This also covers merge commits,
          # where comparing against HEAD~1 is unreliable (the first parent
          # may predate the version bump that the merge brought in).
          CURRENT_TAG="alpha-v${CURRENT_VERSION}-build${CURRENT_BUILD}"
          if git rev-parse -q --verify "refs/tags/${CURRENT_TAG}" >/dev/null; then
            echo "Tag ${CURRENT_TAG} already exists — version was already released, bumping forward."
            VERSION_ALREADY_RELEASED=true
          else
            echo "Tag ${CURRENT_TAG} does not exist yet."
            VERSION_ALREADY_RELEASED=false
          fi

          PREV_VERSION_LINE=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || true)
          if [[ "$VERSION_ALREADY_RELEASED" == "false" ]] && [[ -n "$PREV_VERSION_LINE" && "$CURRENT_VERSION_LINE" != "$PREV_VERSION_LINE" ]]; then
            echo "Version was manually updated in this commit from $PREV_VERSION_LINE to $CURRENT_VERSION_LINE"
            NEXT_VERSION="$CURRENT_VERSION"
            NEXT_BUILD="$CURRENT_BUILD"
            NEXT_VERSION_LINE="$CURRENT_VERSION_LINE"
            BUMP_TYPE="manual"
          else
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

            BUMP_TYPE="$DISPATCH_BUMP_TYPE"
            if [[ -z "$BUMP_TYPE" ]]; then
              if echo "$COMMIT_MSG" | grep -qiE "(major upgrade|make it version 0\.2|\[minor\]|type:\s*minor)"; then
                BUMP_TYPE="minor"
              elif echo "$COMMIT_MSG" | grep -qiE "(breaking|\[major\]|type:\s*major)"; then
                BUMP_TYPE="major"
              else
                BUMP_TYPE="patch"
              fi
            fi
            echo "Bump type: $BUMP_TYPE"

            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor)
                MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch)
                PATCH=$((PATCH + 1)) ;;
            esac

            NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            NEXT_BUILD=$((CURRENT_BUILD + 1))
            NEXT_VERSION_LINE="$NEXT_VERSION+$NEXT_BUILD"
          fi

          # Safety net: if the computed tag somehow already exists (e.g.
          # a concurrent run), skip the release instead of failing.
          NEXT_TAG="alpha-v${NEXT_VERSION}-build${NEXT_BUILD}"
          if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
            echo "Computed tag ${NEXT_TAG} already exists; skipping release."
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          echo "next_version=$NEXT_VERSION"           >> "$GITHUB_OUTPUT"
          echo "next_build=$NEXT_BUILD"               >> "$GITHUB_OUTPUT"
          echo "next_version_line=$NEXT_VERSION_LINE" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE"                 >> "$GITHUB_OUTPUT"
          echo "next_tag=$NEXT_TAG"                   >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE"       >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION_LINE (release: $SHOULD_RELEASE)"

      # ── 5. Patch pubspec.yaml ─────────────────────────────────────
      - name: Update pubspec.yaml
        if: steps.next_version.outputs.should_release == 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.next_version.outputs.next_version_line }}/" pubspec.yaml
          echo "pubspec.yaml updated to ${{ steps.next_version.outputs.next_version_line }}"

      # ── 6. Commit & push the version bump ────────────────────────
      - name: Commit and push version bump
        if: steps.next_version.outputs.should_release == 'true'
        run: |
          if git diff --quiet pubspec.yaml; then
            echo "pubspec.yaml is already up to date; skipping bump commit"
          else
            git add pubspec.yaml
            git commit -m "chore: bump version to ${{ steps.next_version.outputs.next_version_line }} [${{ steps.next_version.outputs.bump_type }}]"
            git push origin main
          fi

      # ── 7. Create & push the release tag ─────────────────────────
      - name: Create release tag
        id: tag
        if: steps.next_version.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.next_version.outputs.next_tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping tag creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG"                                >> "$GITHUB_OUTPUT"
          echo "release_name=Prism Music $TAG"           >> "$GITHUB_OUTPUT"

      # ── 8. Java & Flutter setup ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 9. Optional release signing ───────────────────────────────
      - name: Configure Android signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS:          ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD:       ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" \
             && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=release-keystore.jks"
            } > android/key.properties
            echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"
            echo "Release signing configured from secrets."
          else
            echo "SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "No signing secrets found — using debug signing fallback."
          fi

      # ── 10. Build release APK ────────────────────────────────────
      # Pass BOTH --build-name and --build-number so Flutter writes the
      # correct versionName and versionCode into the APK manifest.
      # This is the fix for the "install conflict / downgrade" error.
      - name: Build release APK
        if: steps.next_version.outputs.should_release == 'true'
        run: |
          flutter build apk --release \
            --build-name "${{ steps.next_version.outputs.next_version }}" \
            --build-number "${{ steps.next_version.outputs.next_build }}" \
            --android-skip-build-dependency-validation

      # ── 11. Build release App Bundle ──────────────────────────────
      - name: Build release App Bundle (AAB)
        if: steps.next_version.outputs.should_release == 'true'
        run: |
          flutter build appbundle --release \
            --build-name "${{ steps.next_version.outputs.next_version }}" \
            --build-number "${{ steps.next_version.outputs.next_build }}" \
            --android-skip-build-dependency-validation

      # ── 12. Stage release assets with descriptive names ──────────
      - name: Prepare release assets
        id: assets
        if: steps.next_version.outputs.should_release == 'true'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          AAB_SRC="build/app/outputs/bundle/release/app-release.aab"
          APK_OUT="prism-music-${TAG}.apk"
          AAB_OUT="prism-music-${TAG}.aab"

          if [[ ! -f "$APK_SRC" ]]; then
            echo "ERROR: Release APK not found at $APK_SRC"; exit 1
          fi
          if [[ ! -f "$AAB_SRC" ]]; then
            echo "ERROR: Release AAB not found at $AAB_SRC"; exit 1
          fi

          cp "$APK_SRC" "$APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"
          sha256sum "$APK_OUT" > "${APK_OUT}.sha256"
          sha256sum "$AAB_OUT" > "${AAB_OUT}.sha256"

          echo "apk=$APK_OUT"                   >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_OUT"                   >> "$GITHUB_OUTPUT"
          echo "apk_sha=${APK_OUT}.sha256"       >> "$GITHUB_OUTPUT"
          echo "aab_sha=${AAB_OUT}.sha256"       >> "$GITHUB_OUTPUT"

      # ── 13. Upload artifacts (downloadable from Actions UI) ───────
      - name: Upload release artifacts
        if: steps.next_version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prism-music-${{ steps.tag.outputs.tag }}
          path: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.aab }}
            ${{ steps.assets.outputs.apk_sha }}
            ${{ steps.assets.outputs.aab_sha }}
          if-no-files-found: error

      # ── 14. Publish ONE GitHub Release with APK/AAB attached ──────
      - name: Publish GitHub Release
        if: steps.next_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name:     ${{ steps.tag.outputs.release_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## Prism Music — Automated Alpha Release

            | Field | Value |
            |-------|-------|
            | **Version** | `${{ steps.next_version.outputs.next_version_line }}` |
            | **Bump type** | `${{ steps.next_version.outputs.bump_type }}` |
            | **versionCode** | `${{ steps.next_version.outputs.next_build }}` |
            | **Signed APK** | `${{ env.SIGNED_BUILD }}` |
            | **Source ref** | `${{ github.sha }}` |

            > ⚠️ This is an automated pre-release and may contain breaking changes.

            ### Install
            Download `prism-music-${{ steps.tag.outputs.tag }}.apk` and sideload it.
            Each release has a strictly increasing `versionCode`, so Android will
            always accept the upgrade without a conflict.
          files: |
            ${{ steps.assets.outputs.apk }}
            ${{ steps.assets.outputs.aab }}
            ${{ steps.assets.outputs.apk_sha }}
            ${{ steps.assets.outputs.aab_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}