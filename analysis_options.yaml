# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - tool/**

  errors:
    # Suppress diagnostics that vary between Flutter SDK versions.
    deprecated_member_use: ignore
    experimental_member_use: ignore
    # The 'hide RepeatMode' is needed on CI's latest stable Flutter where
    # flutter/widgets.dart exports its own RepeatMode. On older local SDKs
    # this causes a harmless 'undefined_hidden_name' warning — suppress it.
    undefined_hidden_name: ignore

linter:
  rules:
    unnecessary_underscores: false
    sort_child_properties_last: false
    use_super_parameters: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
